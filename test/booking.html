<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Regina 专属妆造预约 — 填写您的定制需求。">
  <title>专属预约 · Regina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Noto+Serif+SC:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav scrolled" id="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Regina</a>
      <button class="nav__toggle" id="navToggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav__links" id="navLinks">
        <li><a href="index.html#services">服务</a></li>
        <li><a href="index.html#gallery">作品</a></li>
        <li><a href="index.html#process">流程</a></li>
        <li><a href="index.html#booking">预约</a></li>
      </ul>
      <a href="index.html#booking" class="nav__cta">返回首页</a>
    </div>
  </nav>

  <main class="service-booking">
    <div class="container">
      <a href="index.html#services" class="service-booking__back">← 返回服务列表</a>

      <div class="service-booking__layout">
        <div>
          <p class="service-booking__tag" id="serviceTag">Service</p>
          <h1 class="service-booking__title" id="serviceTitle">专属预约</h1>
          <p class="service-booking__intro" id="serviceIntro"></p>
          <ul class="service-booking__highlights" id="serviceHighlights"></ul>
          <div class="service-booking__visual">
            <img class="cover-img" id="serviceImage" src="" alt="">
          </div>
        </div>

        <div class="service-booking__panel">
          <h2 class="service-booking__panel-title">填写预约信息</h2>
          <p class="service-booking__panel-desc">Regina 团队将在 24 小时内与您联系，所有信息严格保密。</p>

          <form class="service-booking__form" id="serviceBookingForm">
            <input type="hidden" id="serviceType" name="serviceType">

            <div class="form-field">
              <label for="serviceName">服务类型</label>
              <input type="text" id="serviceName" name="serviceName" readonly>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="clientName">姓名</label>
                <input type="text" id="clientName" name="clientName" required placeholder="您的姓名">
              </div>
              <div class="form-field">
                <label for="contact">联系方式</label>
                <input type="text" id="contact" name="contact" required placeholder="手机号 / 微信号">
              </div>
            </div>

            <div class="form-field">
              <label for="appointmentTime">预约时间</label>
              <input type="datetime-local" id="appointmentTime" name="appointmentTime" required>
            </div>

            <div class="form-field">
              <label for="requirements">妆造要求</label>
              <textarea id="requirements" name="requirements" required placeholder="请描述您的妆造风格、场合、特殊需求等…"></textarea>
            </div>

            <div class="form-field">
              <label for="notes">补充说明（选填）</label>
              <textarea id="notes" name="notes" placeholder="其他希望我们提前了解的信息…"></textarea>
            </div>

            <button type="submit" class="btn btn--primary">提交专属预约</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="footer__brand">Regina</span>
      <span class="footer__info">上海市静安区 · 高端妆造定制工作室</span>
      <div class="footer__social">
        <a href="#">WeChat</a>
        <a href="#">Instagram</a>
        <a href="#">Xiaohongshu</a>
      </div>
    </div>
  </footer>

  <script src="js/booking.js" defer></script>
</body>
</html>
